<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>西马 45 天｜互动练习</title>
<style>
:root{--bg:#f6f3ed;--paper:#fffdfa;--ink:#24312e;--muted:#62716c;--line:#dce4dc;--accent:#2b6655;--accent2:#e7f0e9;--wrong:#8d3f39;--wrongbg:#fbefec;--shadow:0 10px 35px #1f352315}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;line-height:1.6}main{max-width:860px;margin:0 auto;padding:30px 18px 70px}header{margin-bottom:22px}.eyebrow{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.1em}h1{font-size:clamp(28px,5vw,42px);line-height:1.25;margin:8px 0 10px}h2{font-size:23px;line-height:1.3;margin:0 0 12px}p{margin:8px 0}small,.muted{color:var(--muted)}.lead{max-width:70ch;color:#495b55}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button{border:1px solid var(--line);background:#fff;padding:10px 17px;border-radius:999px;font:inherit;cursor:pointer}.tabs button.active{background:var(--ink);border-color:var(--ink);color:white}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,32px);box-shadow:var(--shadow)}.toprow{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.chip{background:var(--accent2);color:var(--accent);border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px}.progress{height:9px;background:#e5e9e4;border-radius:99px;overflow:hidden;margin:15px 0 24px}.progress>div{height:100%;background:var(--accent);width:0;transition:width .25s}.prompt{font-size:clamp(20px,3vw,27px);line-height:1.45;font-weight:700;margin:10px 0 22px}.options{display:grid;gap:10px}.option,.choice{width:100%;text-align:left;border:1.5px solid #cddbd1;background:#fff;border-radius:12px;padding:13px 15px;font:inherit;color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s}.option:hover:not(:disabled),.choice:hover:not(:disabled){border-color:var(--accent);background:#f5faf6}.option:disabled,.choice:disabled{cursor:default}.option.good{background:var(--accent2);border-color:var(--accent)}.option.bad{background:var(--wrongbg);border-color:var(--wrong)}.feedback{margin-top:18px;padding:15px 17px;border-radius:12px;background:var(--accent2);border-left:4px solid var(--accent)}.feedback.wrong{background:var(--wrongbg);border-color:var(--wrong)}.feedback strong{display:block;margin-bottom:3px}.controls{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;flex-wrap:wrap}.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 17px;font:inherit;font-weight:700;cursor:pointer}.btn:disabled{opacity:.45;cursor:default}.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.match-grid h3{margin:0 0 6px;font-size:15px;color:var(--muted)}.choice.selected{background:#e6f1e9;border-color:var(--accent)}.choice.matched{background:#e8f0ea;border-color:#acc8b4;color:#52645c}.choice.error{background:var(--wrongbg);border-color:var(--wrong)}.match-note{min-height:30px;margin-top:14px;color:var(--muted)}.result{font-size:24px;font-weight:700}.help{font-size:14px;border-top:1px solid var(--line);padding-top:18px;margin-top:26px}a{color:var(--accent)}[hidden]{display:none!important}@media(max-width:620px){.match-grid{grid-template-columns:1fr}.tabs{margin-top:15px}.card{border-radius:14px}}:focus-visible{outline:3px solid #e8a843;outline-offset:2px}
</style>
</head>
<body><main>
<header><div class="eyebrow">西马 · 每天 5—10 分钟</div><h1>先判断，再看解释</h1><p class="lead">概念配对帮助你找准词义；情境判断帮助你练习“理论能解释什么、不能证明什么”。所有题目都是自编练习，不是考研真题。无需登录，可离线使用。</p></header>
<nav class="tabs" aria-label="练习模式"><button id="tabQuiz" class="active" type="button">情境判断</button><button id="tabMatch" type="button">概念配对</button></nav>
<section id="quiz" class="card" aria-label="情境判断">
 <div class="toprow"><span class="chip" id="quizCategory">基础</span><span class="muted" id="quizCount">1 / 16</span></div><div class="progress" aria-hidden="true"><div id="quizProgress"></div></div>
 <div class="prompt" id="quizPrompt"></div><div id="quizOptions" class="options"></div><div id="quizFeedback" class="feedback" role="status" aria-live="polite" hidden></div>
 <div class="controls"><span id="quizScore" class="muted">已答对 0 题</span><button id="nextQuiz" class="btn" type="button" disabled>下一题</button></div>
</section>
<section id="match" class="card" aria-label="概念配对" hidden>
 <div class="toprow"><span class="chip">概念配对</span><span class="muted" id="matchCount">0 / 8 对</span></div><div class="progress" aria-hidden="true"><div id="matchProgress"></div></div>
 <h2>先点概念，再点对应解释</h2><p class="muted">选错会显示辨析提示；可以再试，不计时。</p><div class="match-grid"><div><h3>概念</h3><div class="options" id="terms"></div></div><div><h3>解释</h3><div class="options" id="defs"></div></div></div><p class="match-note" id="matchNote" role="status" aria-live="polite">选择一个概念开始。</p><div class="controls"><span class="muted">完成后再做一次，看看是否能更快辨认。</span><button id="resetMatch" class="btn ghost" type="button">重新配对</button></div>
</section>
<p class="help">答错后请回到 <a href="西马零基础图文讲义.md">图文讲义</a> 查对应单元，再用 <a href="西马练习与答案.md">练习册</a> 写一段完整回答。手机浏览器若不能直接打开本地链接，可在同一文件夹中手动打开对应文件。</p>
</main>
<script>
const quizData=[
{cat:'基础',q:'某同学说：“商品拜物教就是特别喜欢买东西。”问题在哪里？',o:['把社会关系的呈现误写成个人购物习惯','把商品说成有使用价值','把劳动看得太重要','没有计算商品价格'],a:0,why:'马克思讨论的是生产者之间的社会关系为何呈现为商品之间的关系。喜欢购物是另一个问题。',ref:'讲义第 1、2 节；原笔记 P0008—P0010。'},
{cat:'基础',q:'“只要一项制度使用数字，就一定是物化。”怎样判断？',o:['正确，数字本身就是物化','不充分；要看数字怎样组织关系、谁制定规则、是否压平人的经验','正确，只要有排行榜','无法讨论任何数字制度'],a:1,why:'数字是工具。卢卡奇式分析需要说明它怎样使社会关系呈现为独立的物的规律，并影响人的行动态度。',ref:'讲义第 2 节；P0030—P0069。'},
{cat:'卢卡奇',q:'外卖计时规则被骑手当成“只能服从的自然规律”。哪一概念最贴近？',o:['物化意识','符号价值','症候阅读','基本压抑'],a:0,why:'物化意识强调人把历史形成的社会规则视为当然、不可改变的规律。仍须调查真实规则和协商机制。',ref:'讲义第 2 节；P0056—P0069。'},
{cat:'卢卡奇',q:'“总体性”在复习中最好的用法是什么？',o:['背下社会的一切事实','把局部问题放回具体社会历史联系','任何时候整体利益压过个人','把九位思想家说成同一观点'],a:1,why:'总体性帮助看见局部之间的关系及其历史生成，不是知识总量或政治口号。',ref:'讲义第 2 节；P0071—P0096。'},
{cat:'科尔施',q:'一种理论只保存结论，完全不问它与现实实践的关系。科尔施最可能质疑什么？',o:['它没有足够多的术语','理论的哲学批判维度与实践联系被削弱','它不够像自然科学','它没有使用统计图'],a:1,why:'科尔施讨论马克思主义理论本身的历史位置，强调理论与实践的内在联系。',ref:'讲义第 3 节；P0162—P0225。'},
{cat:'霍克海默',q:'学校只按流量决定课程。“批判理论”的首个问题更可能是？',o:['怎样让流量再涨 10%','这套评价服务什么目的、遗漏谁的需要','所有数字都应删除','是否有学生喜欢视频'],a:1,why:'批判理论不只优化既定手段，还追问制度目的与社会后果。',ref:'讲义第 4 节；P0263—P0274。'},
{cat:'阿多诺',q:'用一个分数概括一个学生后，仍要追问被遗漏的经验。最贴近哪个概念？',o:['非同一性','机械趋同','策略行动','符号价值'],a:0,why:'阿多诺提醒概念无法完全涵盖具体对象；他并不主张抛弃概念。',ref:'讲义第 5 节；P0422—P0458。'},
{cat:'马尔库塞',q:'团队共同生活需要基本规则。马尔库塞会把所有规则都称为“额外压抑”吗？',o:['会，任何规则都是压抑','不会；要区分共同生活必要限制与服务特定支配的附加限制','会，因为所有劳动都无意义','无法区分'],a:1,why:'基本压抑与额外压抑是关键区别；后者须在具体历史条件中分析。',ref:'讲义第 6 节；P0502—P0537。'},
{cat:'弗洛姆',q:'某人害怕脱离群体而盲目跟随潮流。哪个理论可提出问题，但不能据此给人“诊断”？',o:['社会性格与逃避自由','商品的交换价值','客体优先性','认识论断裂'],a:0,why:'弗洛姆可帮助研究社会条件与心理倾向，但单次行为不足以诊断一个人的人格。',ref:'讲义第 7 节；P0682—P0748。'},
{cat:'哈贝马斯',q:'一位同学说“今天下雨了”。首先可质疑哪种有效性要求？',o:['事实真理性','规范正当性','表达真诚性','符号价值'],a:0,why:'有关客观世界的陈述首先面临事实是否真实的检验；真实交往中也可能涉及其他要求。',ref:'讲义第 8 节；P0779—P0786。'},
{cat:'哈贝马斯',q:'“这项校规是否公平？”首先涉及哪种有效性要求？',o:['事实真理性','规范正当性','交换价值','客体优先性'],a:1,why:'规范能否得到合理辩护，是正当性问题。',ref:'讲义第 8 节；P0779—P0786。'},
{cat:'哈贝马斯',q:'市场和行政系统的出现本身就是“生活世界殖民化”吗？',o:['是','不是；要看它是否挤压本需交往协调的领域','只要效率提高就是','只要效率下降就是'],a:1,why:'系统分化也有协调作用。殖民化指系统机制越界并损害生活世界的再生产。',ref:'讲义第 8 节；P0792—P0824。'},
{cat:'鲍德里亚',q:'功能相近的两款产品因品牌身份意味而形成差异。哪一概念有助分析？',o:['符号价值','基本压抑','阶级意识','客体优先性'],a:0,why:'符号价值描述商品在差异与身份体系中的意义；仍需考察品质、价格等因素。',ref:'讲义第 9 节；P0899—P0905。'},
{cat:'鲍德里亚',q:'“生产的终结”是否意味着现实中再没有工厂和劳动？',o:['意味着','不意味着；它是有争议的理论命题','仅意味着服务业消失','等于商品拜物教'],a:1,why:'不能把鲍德里亚带有理论立场的“终结”说法按日常字面理解。',ref:'讲义第 9 节；P0906—P0984。'},
{cat:'阿尔都塞',q:'一份问卷只问“加班多久”，不问“制度是否合理”。症候阅读会先注意什么？',o:['文本能提出和不能提出的问题','问卷纸张的颜色','作者一定有恶意','所有回答都是假的'],a:0,why:'症候阅读关注问题框架、空白和矛盾；但不能无证据地推断作者动机。',ref:'讲义第 10 节；P1096—P1130。'},
{cat:'阿尔都塞',q:'“理论上的反人道主义”最稳妥的理解是？',o:['阿尔都塞反对尊重人','他反对把抽象人性当作社会科学解释起点','所有人都被医学判为异常','个体不会行动'],a:1,why:'这是方法论争论，不是伦理上反对人的尊严。',ref:'讲义第 10 节；P1185—P1191。'}
];
const pairData=[
{term:'物化意识',def:'把历史形成的社会结构当作自然规律并被动适应',tip:'它指对物化结构的认同，不只是看到很多商品。'},
{term:'总体性',def:'从具体历史社会联系理解局部',tip:'不是知道所有事实。'},
{term:'非同一性',def:'具体对象不能被概念完全涵盖',tip:'也不等于拒绝概念。'},
{term:'额外压抑',def:'特定支配关系要求的附加限制',tip:'要与共同生活所需的基本限制区分。'},
{term:'社会性格',def:'社会条件中较常见的性格倾向',tip:'不是人人性格相同。'},
{term:'生活世界殖民化',def:'系统机制挤压需要交往协调的生活领域',tip:'系统分化本身不等于殖民化。'},
{term:'符号价值',def:'商品在身份与差异体系中的意义',tip:'与用途和价格有关，但不等同。'},
{term:'症候阅读',def:'从文本空白与矛盾辨认问题框架',tip:'必须有文本证据，不能任意猜测。'}
];
const $=id=>document.getElementById(id);let qIndex=0,score=0,answered=false;
function renderQuiz(){const d=quizData[qIndex];$('quizCategory').textContent=d.cat;$('quizCount').textContent=`${qIndex+1} / ${quizData.length}`;$('quizProgress').style.width=`${100*qIndex/quizData.length}%`;$('quizPrompt').textContent=d.q;$('quizScore').textContent=`已答对 ${score} 题`;$('quizOptions').replaceChildren();$('quizFeedback').hidden=true;$('nextQuiz').disabled=true;answered=false;d.o.forEach((label,i)=>{const b=document.createElement('button');b.type='button';b.className='option';b.textContent=`${'ABCD'[i]}. ${label}`;b.addEventListener('click',()=>choose(i));$('quizOptions').append(b)});$('nextQuiz').textContent=qIndex===quizData.length-1?'查看结果':'下一题'}
function choose(i){if(answered)return;answered=true;const d=quizData[qIndex],ok=i===d.a;if(ok)score++;[...$('quizOptions').children].forEach((b,j)=>{b.disabled=true;if(j===d.a)b.classList.add('good');if(j===i&&!ok)b.classList.add('bad')});const f=$('quizFeedback');f.className='feedback'+(ok?'':' wrong');f.replaceChildren();const strong=document.createElement('strong');strong.textContent=ok?'答对了':'再辨一遍';const explanation=document.createElement('div');explanation.textContent=d.why;const ref=document.createElement('small');ref.textContent=d.ref;f.append(strong,explanation,ref);f.hidden=false;$('quizScore').textContent=`已答对 ${score} 题`;$('quizProgress').style.width=`${100*(qIndex+1)/quizData.length}%`;$('nextQuiz').disabled=false}
$('nextQuiz').addEventListener('click',()=>{if(qIndex>=quizData.length){qIndex=0;score=0;const box=$('quiz');box.querySelector('.toprow').hidden=false;box.querySelector('.progress').hidden=false;renderQuiz();return}if(qIndex<quizData.length-1){qIndex++;renderQuiz();return}qIndex=quizData.length;const box=$('quiz');box.querySelector('.toprow').hidden=true;box.querySelector('.progress').hidden=true;$('quizPrompt').textContent=`本轮完成：${score} / ${quizData.length} 题`;$('quizOptions').replaceChildren();const p=document.createElement('p');p.textContent=score>=13?'可以进入练习册的简答题。':score>=9?'回到讲义复习答错概念，再做一轮。':'先读讲义第 1 节和相关单元，每天只练少量题。';$('quizOptions').append(p);$('quizFeedback').hidden=true;$('quizScore').textContent='分数只用于找到薄弱点';$('nextQuiz').textContent='重新开始'});
function shuffle(arr){return arr.map(x=>({x,r:Math.random()})).sort((a,b)=>a.r-b.r).map(v=>v.x)}let selected=null,matched=new Set(),termButtons=[],defButtons=[];
function renderMatch(){selected=null;matched=new Set();$('terms').replaceChildren();$('defs').replaceChildren();$('matchNote').textContent='选择一个概念开始。';$('matchCount').textContent=`0 / ${pairData.length} 对`;$('matchProgress').style.width='0%';termButtons=[];defButtons=[];shuffle(pairData.map((_,i)=>i)).forEach(i=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=pairData[i].term;b.addEventListener('click',()=>selectTerm(i));$('terms').append(b);termButtons[i]=b});shuffle(pairData.map((_,i)=>i)).forEach(i=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=pairData[i].def;b.addEventListener('click',()=>selectDef(i));$('defs').append(b);defButtons[i]=b})}
function selectTerm(i){if(matched.has(i))return;termButtons.forEach(b=>b.classList.remove('selected'));selected=i;termButtons[i].classList.add('selected');$('matchNote').textContent=`已选择“${pairData[i].term}”，请点对应解释。`}
function selectDef(i){if(selected===null||matched.has(i))return;if(i===selected){matched.add(i);termButtons[i].classList.remove('selected');termButtons[i].classList.add('matched');defButtons[i].classList.add('matched');termButtons[i].disabled=true;defButtons[i].disabled=true;selected=null;$('matchNote').textContent=matched.size===pairData.length?'全部配对完成。试着不看提示，向自己解释这些词的区别。':`正确。${pairData[i].tip}`;$('matchCount').textContent=`${matched.size} / ${pairData.length} 对`;$('matchProgress').style.width=`${100*matched.size/pairData.length}%`}else{defButtons[i].classList.add('error');setTimeout(()=>defButtons[i].classList.remove('error'),550);$('matchNote').textContent=`还不对。${pairData[selected].tip}`}}
$('resetMatch').addEventListener('click',renderMatch);
function setTab(name){const quiz=name==='quiz';$('quiz').hidden=!quiz;$('match').hidden=quiz;$('tabQuiz').classList.toggle('active',quiz);$('tabMatch').classList.toggle('active',!quiz);$('tabQuiz').setAttribute('aria-selected',quiz);$('tabMatch').setAttribute('aria-selected',!quiz)}$('tabQuiz').addEventListener('click',()=>setTab('quiz'));$('tabMatch').addEventListener('click',()=>setTab('match'));renderQuiz();renderMatch();
</script></body></html>
