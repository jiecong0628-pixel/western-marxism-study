<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>西马 45 天｜从理解到作答</title>
<style>
:root{--bg:#f4f1ea;--paper:#fffefa;--ink:#24342f;--muted:#61716a;--line:#dbe2d8;--green:#206c57;--greenbg:#e8f4ee;--gold:#9e6100;--goldbg:#fff2d7;--red:#a33c3c;--redbg:#fff0ed;--blue:#365f9c;--bluebg:#edf3fc;--radius:16px;--font:18px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;font-size:var(--font);line-height:1.75}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:var(--green)}:focus-visible{outline:3px solid #edb754;outline-offset:2px}.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}.side{background:#173d34;color:#eaf5ed;padding:25px 18px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-weight:850;font-size:24px;line-height:1.3;margin:2px 4px 8px}.side p{color:#c5d8cf;font-size:14px;line-height:1.5;margin:5px 4px 20px}.side button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#e9f3eb;border-radius:11px;padding:11px 13px;margin:3px 0}.side button.active,.side button:hover{background:#2e5b4f}.side .mini{border-top:1px solid #497367;margin-top:24px;padding:20px 5px;font-size:14px;color:#c5d8cf}.main{max-width:1060px;width:100%;margin:0 auto;padding:25px clamp(16px,3vw,40px) 80px}.eyebrow{color:var(--green);font-weight:800;letter-spacing:.06em;font-size:13px;text-transform:uppercase}.hero{background:linear-gradient(120deg,#fffefa,#e8f4ee);border:1px solid #d7e5d9;border-radius:22px;padding:25px 30px;margin-bottom:20px}.hero h1{font-size:clamp(28px,4vw,43px);line-height:1.23;margin:8px 0}.hero p{margin:8px 0;color:#4c6258}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.pill,.tag{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:750;vertical-align:middle}.pill{background:#e6ede7;color:#355b4d}.tag-note{background:#e7eef8;color:var(--blue)}.tag-extra{background:var(--greenbg);color:var(--green)}.tag-uncertain{background:var(--goldbg);color:var(--gold)}.tag-important{background:var(--redbg);color:var(--red)}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(18px,3vw,28px);box-shadow:0 8px 25px #28432d0a;margin:15px 0}.card h2,.card h3{line-height:1.35;margin:0 0 14px}.card h2{font-size:26px}.card h3{font-size:21px;margin-top:20px}.card h4{font-size:18px}.card p{margin:10px 0}.muted{color:var(--muted)}.small{font-size:14px}.notice{border-left:5px solid var(--green);background:var(--greenbg);padding:12px 16px;border-radius:8px;margin:14px 0}.notice.warn{border-color:var(--gold);background:var(--goldbg)}.notice.danger{border-color:var(--red);background:var(--redbg)}.steps{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin:15px 0}.step{border:1px solid var(--line);border-radius:11px;background:white;padding:8px 5px;font-size:13px;text-align:center;line-height:1.4}.step.active{background:#173d34;color:white}.step.done{border-color:#75ad8e;background:#e7f3ea}.btn{border:0;border-radius:10px;background:var(--green);color:white;font-weight:750;padding:10px 16px}.btn.secondary{background:white;color:var(--green);border:1px solid var(--green)}.btn.warn{background:var(--red)}.btn:disabled{opacity:.45;cursor:not-allowed}textarea,input[type=text],input[type=number],select{width:100%;border:1px solid #bdcbc1;border-radius:10px;padding:10px 12px;background:white;color:var(--ink)}textarea{min-height:120px;resize:vertical;line-height:1.65}label{font-weight:700;display:block;margin:13px 0 5px}.choice{display:block;width:100%;text-align:left;background:#fff;border:1px solid #cbdad1;color:var(--ink);padding:10px 13px;border-radius:10px;margin:8px 0}.choice:hover{background:#f2faf4}.choice.correct{border-color:var(--green);background:var(--greenbg)}.choice.wrong{border-color:var(--red);background:var(--redbg)}.choice:disabled{cursor:default}.optionwhy{border-bottom:1px solid var(--line);padding:7px 0}.optionwhy:last-child{border:0}.progress{height:10px;background:#dfe8df;border-radius:99px;overflow:hidden;margin:13px 0}.progress>span{height:100%;display:block;background:var(--green);border-radius:99px}.source-row{border-bottom:1px solid var(--line);padding:12px 3px}.source-row:last-child{border:0}.source-id{color:var(--blue);font-size:13px;font-weight:800;margin-right:10px}.source-link{background:none;border:0;padding:0;color:var(--blue);text-decoration:underline;font-size:inherit}.chapter-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.chapter-tile{border:1px solid var(--line);border-radius:12px;padding:15px;background:white;text-align:left}.chapter-tile:hover{border-color:var(--green)}.map-flow{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin:15px 0}.map-node{background:var(--bluebg);border:1px solid #b8cbe8;border-radius:10px;padding:7px 10px;font-weight:700}.map-arrow{color:var(--blue);font-size:21px}.map-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.map-card{background:white;border:1px solid var(--line);border-radius:12px;padding:15px}.map-card strong{color:var(--green)}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:.9em}th,td{padding:9px 11px;border:1px solid var(--line);vertical-align:top;text-align:left}th{background:#e8efe8}details{border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px 14px;margin:10px 0}summary{font-weight:750;cursor:pointer}blockquote{margin:14px 0;padding:9px 16px;border-left:4px solid var(--green);background:#f0f7f1}code{background:#edf1ed;padding:1px 4px;border-radius:4px}.source-modal{position:fixed;inset:0;background:#172c28aa;z-index:20;display:none;padding:5vh 12px}.source-modal.open{display:block}.source-dialog{max-width:780px;max-height:90vh;overflow:auto;margin:auto;background:var(--paper);border-radius:18px;padding:22px}.source-dialog img{max-width:100%;height:auto}.source-dialog h2{margin:0}.workline{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.workline>*{flex:1}.question-head{font-weight:750;margin:10px 0}.hidden{display:none!important}.footer{font-size:13px;color:var(--muted);padding:25px 0}.img-note{max-width:100%;height:auto;border:1px solid var(--line);border-radius:9px}.home-stat{font-size:15px}.source-reader{max-height:62vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px 17px}.source-row:target{background:var(--goldbg)}
@media(max-width:780px){.shell{display:block}.side{position:relative;height:auto;padding:15px}.brand{font-size:20px}.side p,.side .mini{display:none}.side nav{display:flex;overflow:auto;gap:3px}.side button{white-space:nowrap;width:auto;font-size:13px}.main{padding:18px 15px 70px}.hero{padding:20px}.steps{display:flex;overflow:auto}.step{min-width:89px}.card h2{font-size:23px}}
</style></head>
<body><div class="shell"><aside class="side"><div class="brand">西马 · 45 天</div><p>从基础概念出发，每天读一点原笔记、想清论证、练一道题。</p><nav aria-label="主导航"><button type="button" data-nav="today" class="active">今天学习</button><button type="button" data-nav="chapters">完整讲义</button><button type="button" data-nav="source">原笔记</button><button type="button" data-nav="questions">题库</button><button type="button" data-nav="map">知识地图</button><button type="button" data-nav="progress">进度与设置</button></nav><div class="mini" id="sideProgress"></div></aside><main class="main" id="main" tabindex="-1"></main></div><div class="source-modal" id="sourceModal" aria-hidden="true"><div class="source-dialog" role="dialog" aria-modal="true" aria-label="原笔记段落"><div class="row between"><h2>原笔记定位</h2><button class="btn secondary" type="button" id="closeSource">关闭</button></div><div id="modalBody"></div></div></div>
<script>const DATA=__DATA__;</script>
<script>
const STORE='ximarx-45-integrated-v1';const STEP_NAMES=['旧知回忆','读原笔记','分层讲解','即时练习','书面作答','订正反思','完成记录'];const CHMAP={'基础':'base','卢卡奇':'luk','科尔施':'korsch','霍克海默':'hork','阿多诺':'adorno','马尔库塞':'marcuse','弗洛姆':'fromm','哈贝马斯':'habermas','鲍德里亚':'baudrillard','阿尔都塞':'althusser'};
const CH_LABEL={base:'零基础',luk:'卢卡奇',korsch:'科尔施',hork:'霍克海默',adorno:'阿多诺',marcuse:'马尔库塞',fromm:'弗洛姆',habermas:'哈贝马斯',baudrillard:'鲍德里亚',althusser:'阿尔都塞',review:'每周检查',compare:'跨学派比较',final:'考前整合'};
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clone=x=>JSON.parse(JSON.stringify(x));const refHtml=s=>esc(s).replace(/P\d{4}/g,p=>`<button class="source-link" data-ref="${p}" type="button">${p}</button>`);
function fresh(){return {version:1,day:1,completed:[],stepDone:{},writing:{},reflection:{},wrong:{},quizAnswers:{},dayQuestions:{},weekly:{},lastWrong:'尚无错题',font:18,activeStep:0,readerChapter:'luk',questionFilter:'all',sourceQuery:'',sourceChapter:'all',showAllSource:false}}
let pendingBackup=null;let state;try{state=Object.assign(fresh(),JSON.parse(localStorage.getItem(STORE)||'{}'))}catch(e){state=fresh()}let nav='today';
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){alert('本机保存失败，请立即在“进度与设置”导出备份。')}}
function day(){return DATA.days[state.day-1]||DATA.days[44]}
function doneKey(d,step){return d+'-'+step}function setDone(step){state.stepDone[doneKey(state.day,step)]=true;save();render()}
function stepTime(d){let prev=7*Math.floor((d.day-1)/7);let long=sourceIds(d.source).reduce((n,i)=>n+DATA.source[i-1].text.length,0)>1500;return d.weekly?[10,10,10,15,12,3,0]:state.weekly[prev]!==undefined&&state.weekly[prev]<75?(long?[13,9,18,10,8,2,0]:[13,5,22,10,8,2,0]):(long?[8,14,18,10,8,2,0]:[8,10,22,10,8,2,0])}
function remain(d){let t=stepTime(d);return t.reduce((a,v,i)=>a+(state.stepDone[doneKey(d.day,i)]?0:v),0)}
function setNav(n){nav=n;document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===n));render();window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>setNav(b.dataset.nav)));
function sourceIds(spec){let ids=[];for(let part of spec.split(';')){let m=part.match(/^P(\d{4})-P(\d{4})$/);if(m){for(let i=+m[1];i<=+m[2];i++)ids.push(i)}else if(/^P\d{4}$/.test(part))ids.push(+part.slice(1))}return [...new Set(ids)].filter(i=>i>=1&&i<=DATA.source.length)}
function sourceItem(i){let x=DATA.source[i-1];if(!x)return '';return `<div class="source-row" id="src-${x.id}"><span class="source-id">${x.id} · 原笔记</span>${esc(x.text)}</div>`}
function titleCard(title,sub){return `<div class="hero"><div class="eyebrow">西方马克思主义 · 通用复习</div><h1>${esc(title)}</h1><p>${esc(sub)}</p></div>`}
function drawSteps(d){let t=stepTime(d);return `<div class="steps" role="tablist" aria-label="今日学习路径">${STEP_NAMES.map((n,i)=>`<button class="step ${state.activeStep===i?'active':''} ${state.stepDone[doneKey(d.day,i)]?'done':''}" data-step="${i}" type="button" role="tab" aria-selected="${state.activeStep===i}">${state.stepDone[doneKey(d.day,i)]?'✓ ':''}${n}${t[i]?`<br>${t[i]} 分钟`:''}</button>`).join('')}</div>`}
function dailyQuiz(d){if(state.dayQuestions[d.day])return state.dayQuestions[d.day];let due=Object.entries(state.wrong).filter(([id,w])=>w.due<=d.day).map(([id])=>id).slice(0,2);let pool;if(d.chapter==='base')pool=DATA.quiz.filter(q=>q.cat==='基础');else if(CH_LABEL[d.chapter]&&d.chapter!=='review'&&d.chapter!=='compare'&&d.chapter!=='final')pool=DATA.quiz.filter(q=>CHMAP[q.cat]===d.chapter);else{let lo=d.weekly?Math.max(0,d.day-10):0;let cats=new Set(DATA.days.slice(lo,d.day).map(x=>x.chapter));pool=DATA.quiz.filter(q=>cats.has(CHMAP[q.cat])||d.chapter==='final'||d.chapter==='compare')}
let start=(d.day*2)%Math.max(1,pool.length);let freshIds=[];for(let j=0;j<Math.min(d.weekly?4:2,pool.length);j++)freshIds.push(pool[(start+j)%pool.length].id);let result=[...new Set([...due,...freshIds])];state.dayQuestions[d.day]=result;save();return result}
function qObject(id){return DATA.quiz.find(q=>q.id===id)}
function selectQ(id,index){let q=qObject(id),key=state.day+'-'+id;if(state.quizAnswers[key]!==undefined)return;state.quizAnswers[key]=index;if(index!==q.a){state.lastWrong=`第 ${state.day} 天 ${q.cat} ${id}：选了 ${'ABCD'[index]}，应选 ${'ABCD'[q.a]}；${q.ex[index]}`;state.wrong[id]={due:state.day+1,stage:0}}else if(state.wrong[id]){let st=state.wrong[id].stage+1;if(st>=3)delete state.wrong[id];else state.wrong[id]={due:state.day+(st===1?3:7),stage:st}}save();render()}
function renderQuizQuestion(id){let q=qObject(id),key=state.day+'-'+id,selected=state.quizAnswers[key],answered=selected!==undefined;return `<div class="card"><div class="row"><span class="pill">${esc(q.cat)}</span><span class="tag tag-note">模拟题</span><span class="muted small">${id} · ${refHtml(q.ref)}</span></div><div class="question-head">${esc(q.q)}</div>${q.o.map((o,i)=>`<button class="choice ${answered?(i===q.a?'correct':i===selected?'wrong':''):''}" type="button" data-q="${id}" data-answer="${i}" ${answered?'disabled':''}>${'ABCD'[i]}. ${esc(o)}</button>`).join('')}${answered?`<div class="notice ${selected===q.a?'':'danger'}"><strong>${selected===q.a?'答对了':'答错了，已进入再练队列'}</strong><p>${esc(q.why||'逐项辨析如下。')}</p>${q.o.map((o,i)=>`<div class="optionwhy"><strong>${'ABCD'[i]} ${i===q.a?'正确':'不选'}：</strong>${esc(q.ex[i])}</div>`).join('')}</div>`:''}</div>`}
function renderToday(){let d=day(),pct=Math.round(state.completed.length/45*100);let t=stepTime(d);$('sideProgress').innerHTML=`已完成 ${state.completed.length}/45 天<div class="progress"><span style="width:${pct}%"></span></div>按学习日推进，无需追赶日历。`;
 let top=titleCard(`第 ${d.day} 天 · ${d.focus}`,`今日预计还需 ${remain(d)} 分钟 · ${d.weekly?'每周检查':'每天 1 小时'} · 上次错题：${state.lastWrong}`)+`<div class="card home-stat"><div class="row between"><strong>今日路径：回忆 → 原笔记 → 讲解 → 小题 → 大题 → 反思</strong><span class="pill">${state.completed.length}/45 天已完成</span></div><div class="progress"><span style="width:${Math.round(state.completed.length/45*100)}%"></span></div><label for="dayPick">切换学习日</label><select id="dayPick">${DATA.days.map(x=>`<option value="${x.day}" ${x.day===d.day?'selected':''}>第 ${x.day} 天 · ${esc(x.focus)} ${state.completed.includes(x.day)?'✓':''}</option>`).join('')}</select></div>${drawSteps(d)}`;
 let s=state.activeStep,body='';
 if(s===0){let due=Object.keys(state.wrong).filter(id=>state.wrong[id].due<=d.day);body=`<h2>① 合上讲义，先从记忆里找答案</h2><p>${d.day===1?'先写你对“主体”“客体”的直觉理解；不求答对，之后再修正。':'用自己的话说：上一次学的人物在回答什么问题？他用了什么概念？概念之间怎样连接？'}</p>${due.length?`<div class="notice danger"><strong>今日待重练：</strong>${due.map(esc).join('、')}。写完回忆再到小题环节。</div>`:''}<label for="recallInput">我的闭书解释</label><textarea id="recallInput" placeholder="不必完整。先写你现在真正记得的，再核对。">${esc(state.writing[d.day+'-recall']||'')}</textarea><div class="row"><button class="btn" data-save="recall" type="button">保存回忆，继续</button></div>`}
 if(s===1){let ids=sourceIds(d.source);body=`<h2>② 读原笔记：${esc(d.source)}</h2><p class="muted">这些段落保持原文用字；它们可能含课堂简写或错误。带着今天的问题读，遇到不清之处回讲解核对。</p><div class="source-reader">${ids.map(sourceItem).join('')}</div>${d.focus.includes('G1')||d.focus.includes('G2')||d.focus.includes('G3')?`<div class="card"><h3>今天要看的原图</h3>${['G1','G2','G3'].filter(g=>d.focus.includes(g)).map(g=>`<img class="img-note" src="${DATA.images[g]}" alt="原笔记 ${g}"><p class="small muted">${g} 位于 ${DATA.imagePositions[g]} 后。手写不清处请以讲解的核查提示为准。</p>`).join('')}</div>`:''}<div class="notice warn"><strong>阅读提示</strong>：读完在脑中说出本段主张、依据与不确定处。原笔记全篇可在“原笔记”页面检索。</div><button class="btn" data-complete="1" type="button">已读并说出一个疑问，继续</button>`}
 if(s===2){body=renderDailyLesson(d)+`<button class="btn" data-complete="2" type="button">完成今天的讲解，继续练习</button>`}
 if(s===3){let ids=dailyQuiz(d),all=ids.every(id=>state.quizAnswers[d.day+'-'+id]!==undefined);body=`<h2>④ 即时练习：先选，再逐项看解析</h2><p>答错题在后续学习日再次出现。仅看答案不计为练习。</p>${ids.map(renderQuizQuestion).join('')}<button class="btn" data-complete="3" type="button" ${all?'':'disabled'}>完成小题，继续书面作答</button>`}
 if(s===4){let e=DATA.essays.find(x=>x.id===d.essay);let key=d.day+'-essay';let shown=!!state.stepDone[doneKey(d.day,4)]||!!state.writing[key+'-shown'];body=`<h2>⑤ ${d.weekly?'每周限时作答':'大题训练'} · ${e.kind}</h2><div class="notice"><span class="tag tag-note">模拟题</span> ${esc(e.id)} · ${refHtml(e.ref)}</div><p class="question-head">${esc(e.title)}</p><p class="muted">第 1 轮可写提纲；第 2 轮尽量闭书成文。先写“问题—机制—结论—边界”。</p><label for="essayInput">我的答案或提纲</label><textarea id="essayInput" placeholder="先独立作答，再显示参考答案。">${esc(state.writing[key]||'')}</textarea><div class="row"><button class="btn" data-save="essay" type="button">保存并看参考答案</button></div>${shown?`<div class="card"><h3>参考答案与评分</h3><p>${esc(e.answer)}</p><p><strong>分步得分点：</strong>${esc(e.points)}</p><div class="notice warn"><strong>常见失分：</strong>${esc(e.loss)}</div><button class="btn" data-complete="4" type="button">核对并继续订正</button></div>`:''}`}
 if(s===5){let key=d.day+'-reflection';body=`<h2>⑥ 订正与反思</h2><p>写一条今天最容易混淆的概念，以及下次如何辨认。现实案例只作为理论应用；还需要查什么证据？</p><label for="reflectInput">我的困惑、错因和修正</label><textarea id="reflectInput" placeholder="例如：我把物化误写成喜欢购物；下次先说出社会关系如何呈现。">${esc(state.reflection[d.day]||'')}</textarea>${d.weekly?`<label for="weekScore">本周自测正确率／表现（0—100）</label><input id="weekScore" type="number" min="0" max="100" value="${state.weekly[d.day]??''}" placeholder="按概念解释和论证评分，不只看选择题。"><p class="muted">低于 75%：下周把每天 5 分钟原笔记阅读移给旧知回忆；总时长仍为 60 分钟。</p>`:''}<button class="btn" data-save="reflection" type="button">保存反思，继续</button>`}
 if(s===6){let required=[0,1,2,3,4,5].every(i=>state.stepDone[doneKey(d.day,i)]);body=`<h2>⑦ 今日完成记录</h2><p>${required?'六个学习环节已完成。':'还有环节未完成；可以点上方路径补上。'}</p><div class="notice">明天先闭书回忆，再读下一段。已答错的概念会在后续第 1、3、7 个学习日进入练习；不同浏览器间请使用导出与恢复。</div><button class="btn" id="finishDay" type="button" ${required?'':'disabled'}>${d.day===45?'完成第 45 天':'记录完成并进入下一天'}</button>`}
 $('main').innerHTML=top+`<section class="card" aria-live="polite">${body}</section>`+footer();bindToday()}
